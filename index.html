<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DongPiece
  </title>
  <link rel="stylesheet" href="dongPiece.css">
</head>
<body>
  <h1 id="dongPiece">DongPiece</h1>
  <div id="ui">
    <div id="stats">
      <p id="levelText">Lvl: 1</p>
      <p id="hpText">Hp: 50/50</p>
      <p id="beriText">Beri: 10</p>
      <p id="locationText">Location: Dawn Island</p>
    </div>
    <div id="commands">
      <button id="button1">Store</button>
      <button id="button2">Fight</button>
      <button id="button3">Inventory</button>
      <button id="button4">Leave</button>
      <select name="item" id = "itemsList">
      </select>
      <button id="button5">Sell</button>
    </div>
    <div id="inventory">
      <h3>Inventory</h3>
      <p id="inventoryText"></p>
    </div>
    <div id="opponentStats">
      <p id="opponentName">1</p>
      <p id="opponentLvl">2</p>
      <p id="opponentAp">3</p>
      <p id="opponentHealth">4</p>
    </div>
    <div id="chatBox">
      <p id="chat">Welcome Dong! Explore the world of DongPiece by sailing the seas as a pirate!</p>
      <div id="opponentImage">
        <img id = "opponentPic" src="" alt="opponent-image" width="300" height="300">
      </div>
    </div>
  </div>
  <script src="dongPiece.js"></script>
</body>
</html>
